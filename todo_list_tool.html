<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡雲端待辦清單 (Passcode Sync)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for interaction audio effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar & smooth transitions */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
    .strikethrough-transition {
      transition: text-decoration 0.2s ease, opacity 0.2s ease;
    }

    /* Date picker fix for cross-browser visibility and clickability */
    input[type="date"] {
      color-scheme: dark;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: invert(0.8);
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 1;
    }

    /* Light Mode Theme Overrides */
    html.light {
      color-scheme: light;
    }
    html.light body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.light .bg-slate-950 {
      background-color: #ffffff !important;
    }
    html.light .bg-slate-900,
    html.light .bg-slate-900\/90,
    html.light .bg-slate-900\/80,
    html.light .bg-slate-900\/70 {
      background-color: #ffffff !important;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
    }
    html.light .border-slate-800,
    html.light .border-slate-800\/80,
    html.light .border-slate-800\/60,
    html.light .border-slate-700,
    html.light .border-slate-700\/80,
    html.light .border-slate-700\/70 {
      border-color: #e2e8f0 !important;
    }
    html.light .text-slate-100,
    html.light .text-white {
      color: #0f172a !important;
    }
    html.light .text-slate-200 {
      color: #1e293b !important;
    }
    html.light .text-slate-300 {
      color: #334155 !important;
    }
    html.light .text-slate-400 {
      color: #64748b !important;
    }
    html.light .text-slate-500 {
      color: #94a3b8 !important;
    }
    html.light .bg-slate-800 {
      background-color: #f1f5f9 !important;
    }
    html.light select option {
      background-color: #ffffff !important;
      color: #0f172a !important;
    }
    html.light input[type="date"] {
      color-scheme: light !important;
    }
    html.light input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none !important;
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased flex flex-col selection:bg-brand-500 selection:text-white transition-colors duration-300">

  <div class="min-h-full flex flex-col justify-between max-w-4xl w-full mx-auto p-4 sm:p-6 md:p-8">
    
    <!-- Top Header -->
    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white flex items-center gap-2">
              雲端待辦清單
              <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-300 font-medium border border-brand-500/30">即時同步版</span>
            </h1>
            <p class="text-xs text-slate-400 mt-0.5">跨裝置即時同步，隨處掌握個人行程</p>
          </div>
        </div>
      </div>

      <!-- Sync Passcode Control Badge & Theme Switcher -->
      <div class="flex flex-wrap items-center gap-2">
        <!-- Theme Toggle Button -->
        <button 
          id="btn-theme-toggle" 
          type="button" 
          class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-xl border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 hover:text-white transition shadow-sm"
          title="切換淺色/深色主題"
        >
          <span id="theme-toggle-icon">☀️</span>
          <span id="theme-toggle-label">淺色模式</span>
        </button>

        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/70 rounded-2xl p-1.5 pl-3.5 shadow-sm">
          <div class="flex items-center gap-2">
            <span id="sync-status-indicator" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" title="連線同步中"></span>
            <div class="flex flex-col">
              <span class="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Passcode Sync</span>
              <span id="current-passcode-display" class="text-xs font-mono font-bold text-slate-200 tracking-wider">載入中...</span>
            </div>
          </div>
          <button id="btn-copy-sync-link" class="p-1.5 text-slate-400 hover:text-brand-300 hover:bg-slate-800 rounded-lg transition" title="複製分享連結">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
          </button>
          <button id="btn-open-sync-modal" class="px-2.5 py-1 text-xs font-medium bg-brand-600 hover:bg-brand-500 text-white rounded-xl shadow transition">
            更換金鑰
          </button>
        </div>
      </div>
    </header>

    <!-- Overview Metrics Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 my-6">
      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4">
        <div class="text-xs text-slate-400 font-medium">總事項</div>
        <div id="stat-total" class="text-2xl font-bold text-white mt-1">0</div>
      </div>
      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4">
        <div class="text-xs text-amber-400 font-medium">進行中</div>
        <div id="stat-pending" class="text-2xl font-bold text-amber-400 mt-1">0</div>
      </div>
      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4">
        <div class="text-xs text-emerald-400 font-medium">已完成</div>
        <div id="stat-completed" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
      </div>
      <div class="bg-slate-900/70 border border-slate-800/80 rounded-2xl p-4">
        <div class="text-xs text-brand-400 font-medium">完成進度</div>
        <div class="flex items-baseline gap-1 mt-1">
          <span id="stat-percent" class="text-2xl font-bold text-brand-400">0</span>
          <span class="text-xs text-brand-400/80">%</span>
        </div>
      </div>
    </div>

    <!-- Task Creation Form -->
    <form id="todo-form" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl mb-6 space-y-3">
      <div class="flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="todo-input" 
            placeholder="請輸入待辦事項內容... (按 Enter 即可新增)" 
            maxlength="200"
            required
            class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition"
          />
        </div>
        <button 
          type="submit" 
          id="btn-add-todo"
          class="flex items-center justify-center gap-2 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white px-5 py-3 rounded-xl font-medium text-sm shadow-lg shadow-brand-500/20 active:scale-95 transition"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          新增事項
        </button>
      </div>

      <!-- Options Bar: Category, Priority, Due Date -->
      <div class="flex flex-wrap items-center gap-2.5 pt-1 text-xs text-slate-300">
        <div class="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800">
          <span class="text-slate-400">優先級:</span>
          <select id="todo-priority" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer">
            <option value="low" class="bg-slate-900 text-slate-200">🟢 一般</option>
            <option value="medium" selected class="bg-slate-900 text-amber-300">🟡 中等</option>
            <option value="high" class="bg-slate-900 text-rose-300">🔴 緊急重要</option>
          </select>
        </div>

        <div class="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800">
          <span class="text-slate-400">分類:</span>
          <select id="todo-category" class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer">
            <option value="生活" class="bg-slate-900">生活日常</option>
            <option value="工作" class="bg-slate-900">工作專案</option>
            <option value="學習" class="bg-slate-900">自我學習</option>
            <option value="財務" class="bg-slate-900">理財規劃</option>
          </select>
        </div>

        <label for="todo-duedate" class="flex items-center gap-1.5 bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800 cursor-pointer hover:border-slate-700 transition">
          <span class="text-slate-400 select-none">到期日:</span>
          <input 
            type="date" 
            id="todo-duedate" 
            class="bg-transparent text-xs text-slate-200 focus:outline-none cursor-pointer"
          />
        </label>

        <div class="ml-auto flex items-center gap-2">
          <button type="button" id="btn-sound-toggle" class="flex items-center gap-1 text-slate-400 hover:text-slate-200 transition py-1 px-2 rounded hover:bg-slate-800">
            <span id="sound-icon">🔔</span>
            <span id="sound-label" class="text-[11px]">音效開啟</span>
          </button>
        </div>
      </div>
    </form>

    <!-- Filters and Search Toolbar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-4">
      <!-- Status Tabs -->
      <div class="flex items-center p-1 bg-slate-900/80 border border-slate-800 rounded-xl">
        <button data-filter="all" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-medium transition text-white bg-slate-800 shadow">全部</button>
        <button data-filter="active" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">待完成</button>
        <button data-filter="completed" class="filter-tab px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">已完成</button>
      </div>

      <!-- Search & Clear Tools -->
      <div class="flex items-center gap-2 flex-1 sm:justify-end">
        <div class="relative flex-1 sm:max-w-[220px]">
          <input 
            type="text" 
            id="search-input" 
            placeholder="搜尋事項或分類..." 
            class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500"
          />
          <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>

        <button id="btn-clear-completed" class="px-3 py-1.5 rounded-xl border border-slate-800 hover:border-slate-700 bg-slate-900 hover:bg-slate-800 text-xs text-slate-400 hover:text-rose-300 transition whitespace-nowrap">
          清理已完成
        </button>
      </div>
    </div>

    <!-- Todo Item List Area -->
    <main class="flex-1">
      <div id="todo-list" class="space-y-2.5">
        <!-- Dynamic task cards render here -->
      </div>

      <!-- Empty State Indicator -->
      <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
        <div class="w-14 h-14 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-2xl mb-3 text-slate-400">
          📝
        </div>
        <p class="text-sm font-medium text-slate-300">尚無待辦事項</p>
        <p class="text-xs text-slate-500 mt-1">建立第一個項目，或連接到相同的同步金鑰！</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="pt-8 pb-4 text-center text-xs text-slate-500 border-t border-slate-900 mt-8">
      <p>即時數據透過雲端與 Passcode 金鑰即時同步 · 支援多裝置共同維護</p>
    </footer>

  </div>

  <!-- Passcode Management Modal -->
  <div id="sync-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <span>🔑</span> 設定跨裝置同步金鑰 (Passcode)
      </h3>
      <p class="text-xs text-slate-400 mt-2 leading-relaxed">
        在其他電腦、手機或平板輸入<strong class="text-brand-300">相同的 Passcode</strong>，即可在所有裝置間即時共享與同步待辦事項。
      </p>

      <div class="mt-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">輸入或自訂金鑰碼：</label>
          <div class="flex gap-2">
            <input 
              type="text" 
              id="modal-passcode-input" 
              class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm font-mono uppercase text-white focus:outline-none focus:border-brand-500 tracking-wider" 
              placeholder="例如: MY-TODO-888" 
              maxlength="24"
            />
            <button id="btn-generate-code" type="button" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-xl border border-slate-700 transition" title="隨機生成安全代碼">
              隨機產生
            </button>
          </div>
        </div>

        <div class="p-3 bg-slate-950/80 rounded-xl border border-slate-800 text-xs space-y-1.5">
          <div class="text-slate-400 flex justify-between">
            <span>當前專屬共享網址：</span>
            <button id="btn-modal-copy-url" class="text-brand-400 hover:underline">點此複製連結</button>
          </div>
          <p id="modal-share-preview" class="text-[11px] font-mono text-slate-500 truncate select-all">https://...</p>
        </div>
      </div>

      <div class="mt-6 flex items-center justify-end gap-2.5">
        <button id="btn-close-modal" class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white rounded-xl transition">
          取消
        </button>
        <button id="btn-save-passcode" class="px-5 py-2 text-xs font-medium bg-brand-600 hover:bg-brand-500 text-white rounded-xl shadow-lg shadow-brand-500/20 transition">
          切換並載入清單
        </button>
      </div>
    </div>
  </div>

  <!-- Custom Confirmation Modal (Replaces native confirm()) -->
  <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
          </svg>
        </div>
        <div>
          <h4 id="confirm-modal-title" class="text-sm font-bold text-white">確認刪除？</h4>
          <p id="confirm-modal-message" class="text-xs text-slate-400 mt-0.5">此操作將無法復原。</p>
        </div>
      </div>
      <div class="mt-5 flex items-center justify-end gap-2">
        <button id="btn-confirm-cancel" class="px-3.5 py-1.5 text-xs text-slate-400 hover:text-white rounded-lg transition">
          取消
        </button>
        <button id="btn-confirm-ok" class="px-4 py-1.5 text-xs font-medium bg-rose-600 hover:bg-rose-500 text-white rounded-lg shadow transition">
          確認清除
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Box -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Firebase Modular Scripts & Application Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      signInWithCustomToken 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      deleteDoc, 
      collection, 
      onSnapshot, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application state
    let todos = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let soundEnabled = true;
    let unsubscribeFirestore = null;
    let currentUser = null;
    let isOfflineFallback = false;

    // Audio synthesizer for pleasant UI chime
    let synth = null;
    const initAudio = () => {
      if (!synth && typeof Tone !== 'undefined') {
        try {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'sine' },
            envelope: { attack: 0.005, decay: 0.1, sustain: 0.1, release: 0.3 }
          }).toDestination();
          synth.volume.value = -12;
        } catch(e) {
          console.warn("Audio init failed:", e);
        }
      }
    };

    const playCompleteSound = () => {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (Tone.context.state !== 'running') {
          Tone.start();
        }
        if (synth) {
          synth.triggerAttackRelease(['E5', 'B5'], '16n');
        }
      } catch (err) {
        // Silent catch for audio policy restrictions
      }
    };

    // Fallback/Environment configuration
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyDemoPlaceholderOnly",
          authDomain: "demo-todo-sync.firebaseapp.com",
          projectId: "demo-todo-sync",
          storageBucket: "demo-todo-sync.appspot.com",
          messagingSenderId: "1234567890",
          appId: "1:1234567890:web:abcdef123456"
        };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'personal-passcode-todo';
    
    // Resolve active sync passcode (URL param > Local session storage > generated)
    function sanitizePasscode(code) {
      if (!code) return '';
      return code.trim().replace(/[^a-zA-Z0-9_-]/g, '').toUpperCase();
    }

    function generateRandomPasscode() {
      const prefixes = ['SKY', 'STAR', 'SYNC', 'PLAN', 'ECHO', 'MIND'];
      const randNum = Math.floor(1000 + Math.random() * 9000);
      const randPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];
      return `${randPrefix}-${randNum}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    let activePasscode = sanitizePasscode(urlParams.get('code')) || 
                         sanitizePasscode(sessionStorage.getItem('todo_sync_passcode')) || 
                         generateRandomPasscode();

    // Elements
    const syncStatusIndicator = document.getElementById('sync-status-indicator');
    const currentPasscodeDisplay = document.getElementById('current-passcode-display');
    const todoList = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoPriority = document.getElementById('todo-priority');
    const todoCategory = document.getElementById('todo-category');
    const todoDueDate = document.getElementById('todo-duedate');
    const searchInput = document.getElementById('search-input');
    const statTotal = document.getElementById('stat-total');
    const statPending = document.getElementById('stat-pending');
    const statCompleted = document.getElementById('stat-completed');
    const statPercent = document.getElementById('stat-percent');

    // Theme toggle elements
    const btnThemeToggle = document.getElementById('btn-theme-toggle');
    const themeToggleIcon = document.getElementById('theme-toggle-icon');
    const themeToggleLabel = document.getElementById('theme-toggle-label');

    // Modals & UI buttons
    const syncModal = document.getElementById('sync-modal');
    const modalPasscodeInput = document.getElementById('modal-passcode-input');
    const modalSharePreview = document.getElementById('modal-share-preview');
    const btnOpenSyncModal = document.getElementById('btn-open-sync-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnSavePasscode = document.getElementById('btn-save-passcode');
    const btnGenerateCode = document.getElementById('btn-generate-code');
    const btnCopySyncLink = document.getElementById('btn-copy-sync-link');
    const btnModalCopyUrl = document.getElementById('btn-modal-copy-url');
    const btnClearCompleted = document.getElementById('btn-clear-completed');
    const btnSoundToggle = document.getElementById('btn-sound-toggle');
    const soundIcon = document.getElementById('sound-icon');
    const soundLabel = document.getElementById('sound-label');

    // Confirm Modal Elements
    const confirmModal = document.getElementById('confirm-modal');
    const confirmTitle = document.getElementById('confirm-modal-title');
    const confirmMessage = document.getElementById('confirm-modal-message');
    const btnConfirmOk = document.getElementById('btn-confirm-ok');
    const btnConfirmCancel = document.getElementById('btn-confirm-cancel');
    let onConfirmCallback = null;

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        info: 'bg-slate-800 text-slate-200 border-slate-700'
      };

      toast.className = `px-4 py-2.5 rounded-xl text-xs font-medium border shadow-xl flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${type === 'success' ? '✓' : type === 'error' ? '⚠' : 'ℹ'}</span> <span>${message}</span>`;
      
      container.appendChild(toast);
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function openCustomConfirm(title, message, onOk) {
      confirmTitle.textContent = title;
      confirmMessage.textContent = message;
      onConfirmCallback = onOk;
      confirmModal.classList.remove('hidden');
    }

    btnConfirmCancel.addEventListener('click', () => {
      confirmModal.classList.add('hidden');
      onConfirmCallback = null;
    });

    btnConfirmOk.addEventListener('click', () => {
      if (onConfirmCallback) onConfirmCallback();
      confirmModal.classList.add('hidden');
      onConfirmCallback = null;
    });

    function copyToClipboard(text) {
      const tempTextArea = document.createElement('textarea');
      tempTextArea.value = text;
      tempTextArea.style.position = 'fixed';
      tempTextArea.style.opacity = '0';
      document.body.appendChild(tempTextArea);
      tempTextArea.focus();
      tempTextArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful) {
          showToast('同步連結已複製至剪貼簿！', 'success');
        } else {
          showToast('複製失敗，請手動複製網址', 'error');
        }
      } catch (err) {
        showToast('無法自動複製，請手動複製', 'error');
      }
      document.body.removeChild(tempTextArea);
    }

    let app, auth, db;
    let isInitialized = false;

    async function setupFirebase() {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        // RULE 3: Authenticate before queries
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        isInitialized = true;
        bindFirestoreListener();
      } catch (err) {
        console.warn("Firestore 連線失敗，切換至本機暫存模式:", err);
        isOfflineFallback = true;
        syncStatusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-slate-500';
        syncStatusIndicator.title = '離線暫存模式 (未連線雲端)';
        updatePasscodeHeader();
        renderTodoList();
      }
    }

    function getShareableUrl(passcode) {
      const url = new URL(window.location.href);
      url.searchParams.set('code', passcode);
      return url.toString();
    }

    function updatePasscodeHeader() {
      currentPasscodeDisplay.textContent = activePasscode;
      sessionStorage.setItem('todo_sync_passcode', activePasscode);
      modalPasscodeInput.value = activePasscode;
      modalSharePreview.textContent = getShareableUrl(activePasscode);
    }

    function bindFirestoreListener() {
      if (!isInitialized || !db || !auth.currentUser) return;
      
      // Stop previous listener if any
      if (unsubscribeFirestore) {
        unsubscribeFirestore();
        unsubscribeFirestore = null;
      }

      updatePasscodeHeader();

      // STRICT RULE 1: Public path /artifacts/{appId}/public/data/{collectionName}
      // Sanitized passcode becomes the subcollection name
      const collectionName = `sync_vault_${activePasscode.toLowerCase()}`;
      const todosRef = collection(db, 'artifacts', appId, 'public', 'data', collectionName);

      syncStatusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
      syncStatusIndicator.title = '同步連線中...';

      // STRICT RULE 2: No complex query / orderBy in Firestore, sort in memory
      unsubscribeFirestore = onSnapshot(todosRef, (snapshot) => {
        const fetched = [];
        snapshot.forEach((docSnapshot) => {
          fetched.push({
            id: docSnapshot.id,
            ...docSnapshot.data()
          });
        });

        // In-memory sort by createdAt descending
        fetched.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        todos = fetched;

        syncStatusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
        syncStatusIndicator.title = `已即時連線 (金鑰: ${activePasscode})`;
        renderTodoList();
      }, (error) => {
        console.error("Firestore onSnapshot error:", error);
        syncStatusIndicator.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
        syncStatusIndicator.title = '同步發生錯誤';
        showToast('雲端監聽中斷，請重新整理', 'error');
      });
    }

    // Add new task
    async function addTodo(text, priority, category, dueDate) {
      const newTodo = {
        id: 'todo_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
        text: text.trim(),
        priority: priority || 'medium',
        category: category || '生活',
        dueDate: dueDate || '',
        completed: false,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };

      if (!isInitialized || isOfflineFallback) {
        todos.unshift(newTodo);
        renderTodoList();
        showToast('已新增 (本地模式)', 'info');
        return;
      }

      try {
        if (!auth.currentUser) return;
        const collectionName = `sync_vault_${activePasscode.toLowerCase()}`;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, newTodo.id);
        await setDoc(docRef, newTodo);
        showToast('事項已同步至雲端', 'success');
      } catch (err) {
        console.error("Add todo error:", err);
        showToast('儲存失敗，請重試', 'error');
      }
    }

    // Toggle complete
    async function toggleTodo(id) {
      const target = todos.find(t => t.id === id);
      if (!target) return;
      const nextCompleted = !target.completed;

      if (nextCompleted) {
        playCompleteSound();
      }

      if (!isInitialized || isOfflineFallback) {
        target.completed = nextCompleted;
        target.updatedAt = Date.now();
        renderTodoList();
        return;
      }

      try {
        if (!auth.currentUser) return;
        const collectionName = `sync_vault_${activePasscode.toLowerCase()}`;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, id);
        await updateDoc(docRef, {
          completed: nextCompleted,
          updatedAt: Date.now()
        });
      } catch (err) {
        console.error("Toggle error:", err);
        showToast('更新失敗', 'error');
      }
    }

    // Delete single task
    async function deleteTodo(id) {
      if (!isInitialized || isOfflineFallback) {
        todos = todos.filter(t => t.id !== id);
        renderTodoList();
        showToast('已刪除事項', 'info');
        return;
      }

      try {
        if (!auth.currentUser) return;
        const collectionName = `sync_vault_${activePasscode.toLowerCase()}`;
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, id);
        await deleteDoc(docRef);
        showToast('已刪除事項', 'info');
      } catch (err) {
        console.error("Delete error:", err);
        showToast('刪除失敗', 'error');
      }
    }

    // Batch clear completed tasks
    async function clearCompletedTodos() {
      const completedItems = todos.filter(t => t.completed);
      if (completedItems.length === 0) {
        showToast('目前沒有已完成的事項', 'info');
        return;
      }

      openCustomConfirm('清除已完成事項', `確定要刪除 ${completedItems.length} 項已完成的工作嗎？`, async () => {
        if (!isInitialized || isOfflineFallback) {
          todos = todos.filter(t => !t.completed);
          renderTodoList();
          showToast(`已清理 ${completedItems.length} 個項目`, 'info');
          return;
        }

        try {
          if (!auth.currentUser) return;
          const collectionName = `sync_vault_${activePasscode.toLowerCase()}`;
          for (const item of completedItems) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', collectionName, item.id);
            await deleteDoc(docRef);
          }
          showToast(`已清理 ${completedItems.length} 個項目`, 'success');
        } catch (err) {
          console.error("Batch clear error:", err);
          showToast('清理過程中發生錯誤', 'error');
        }
      });
    }

    function updateMetrics() {
      const total = todos.length;
      const completed = todos.filter(t => t.completed).length;
      const pending = total - completed;
      const rate = total === 0 ? 0 : Math.round((completed / total) * 100);

      statTotal.textContent = total;
      statPending.textContent = pending;
      statCompleted.textContent = completed;
      statPercent.textContent = rate;
    }

    function renderTodoList() {
      updateMetrics();

      // Filter and Search logic in memory
      let filtered = todos.filter(item => {
        if (currentFilter === 'active' && item.completed) return false;
        if (currentFilter === 'completed' && !item.completed) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchText = (item.text || '').toLowerCase().includes(q);
          const matchCategory = (item.category || '').toLowerCase().includes(q);
          if (!matchText && !matchCategory) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        todoList.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      const priorityBadge = {
        high: '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30">緊急</span>',
        medium: '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">中等</span>',
        low: '<span class="px-2 py-0.5 rounded-md text-[10px] font-semibold bg-slate-700/50 text-slate-300 border border-slate-600/30">一般</span>'
      };

      todoList.innerHTML = filtered.map(item => {
        const isDone = item.completed;
        const dueText = item.dueDate ? `📅 ${item.dueDate}` : '';

        return `
          <div class="group flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-slate-900/80 border ${isDone ? 'border-slate-800/60 bg-slate-950/40' : 'border-slate-800 hover:border-slate-700'} transition shadow-sm">
            <div class="flex items-center gap-3.5 flex-1 min-w-0">
              <!-- Custom Checkbox Button -->
              <button 
                data-action="toggle" 
                data-id="${item.id}"
                class="w-5 h-5 rounded-lg border flex items-center justify-center transition-all ${isDone ? 'bg-brand-600 border-brand-500 text-white' : 'border-slate-600 hover:border-brand-400 bg-slate-950'}"
              >
                ${isDone ? '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>' : ''}
              </button>

              <!-- Todo Text & Metadata -->
              <div class="flex-1 min-w-0">
                <p class="text-sm break-words strikethrough-transition ${isDone ? 'line-through text-slate-500' : 'text-slate-100'} font-normal leading-relaxed">
                  ${escapeHtml(item.text)}
                </p>
                <div class="flex flex-wrap items-center gap-2 mt-1 text-[11px] text-slate-400">
                  <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">${escapeHtml(item.category || '生活')}</span>
                  ${priorityBadge[item.priority] || priorityBadge.medium}
                  ${dueText ? `<span class="text-slate-400 font-mono">${dueText}</span>` : ''}
                </div>
              </div>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center gap-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition">
              <button 
                data-action="delete" 
                data-id="${item.id}"
                class="p-2 text-slate-500 hover:text-rose-400 hover:bg-slate-800 rounded-xl transition" 
                title="刪除"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Event delegation on task list
    todoList.addEventListener('click', (e) => {
      const button = e.target.closest('button[data-action]');
      if (!button) return;

      const action = button.getAttribute('data-action');
      const id = button.getAttribute('data-id');

      if (action === 'toggle') {
        toggleTodo(id);
      } else if (action === 'delete') {
        const item = todos.find(t => t.id === id);
        openCustomConfirm('刪除事項', `確認刪除「${item ? item.text.substring(0, 16) : '此事項'}」？`, () => {
          deleteTodo(id);
        });
      }
    });

    // Form submission
    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = todoInput.value.trim();
      if (!text) return;

      addTodo(text, todoPriority.value, todoCategory.value, todoDueDate.value);
      todoInput.value = '';
      todoInput.focus();
    });

    // Filters switcher
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => {
          t.classList.remove('text-white', 'bg-slate-800', 'shadow');
          t.classList.add('text-slate-400');
        });
        tab.classList.add('text-white', 'bg-slate-800', 'shadow');
        tab.classList.remove('text-slate-400');

        currentFilter = tab.getAttribute('data-filter');
        renderTodoList();
      });
    });

    // Real-time search input
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderTodoList();
    });

    // Clear completed action
    btnClearCompleted.addEventListener('click', clearCompletedTodos);

    // Audio chime toggle
    btnSoundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔔' : '🔕';
      soundLabel.textContent = soundEnabled ? '音效開啟' : '音效關閉';
      showToast(soundEnabled ? '完成音效已開啟' : '完成音效已關閉', 'info');
    });

    function applyTheme(isLight) {
      if (isLight) {
        document.documentElement.classList.add('light');
        themeToggleIcon.textContent = '🌙';
        themeToggleLabel.textContent = '深色模式';
      } else {
        document.documentElement.classList.remove('light');
        themeToggleIcon.textContent = '☀️';
        themeToggleLabel.textContent = '淺色模式';
      }
      sessionStorage.setItem('todo_theme_mode', isLight ? 'light' : 'dark');
    }

    btnThemeToggle.addEventListener('click', () => {
      const isCurrentlyLight = document.documentElement.classList.contains('light');
      applyTheme(!isCurrentlyLight);
      showToast(!isCurrentlyLight ? '已切換為淺色模式' : '已切換為深色模式', 'info');
    });

    // Passcode modal operations
    btnOpenSyncModal.addEventListener('click', () => {
      updatePasscodeHeader();
      syncModal.classList.remove('hidden');
    });

    btnCloseModal.addEventListener('click', () => {
      syncModal.classList.add('hidden');
    });

    btnGenerateCode.addEventListener('click', () => {
      const generated = generateRandomPasscode();
      modalPasscodeInput.value = generated;
      modalSharePreview.textContent = getShareableUrl(generated);
    });

    modalPasscodeInput.addEventListener('input', () => {
      const sanitized = sanitizePasscode(modalPasscodeInput.value);
      modalSharePreview.textContent = getShareableUrl(sanitized || 'YOUR-PASSCODE');
    });

    btnSavePasscode.addEventListener('click', () => {
      const entered = sanitizePasscode(modalPasscodeInput.value);
      if (!entered) {
        showToast('請輸入有效的 Passcode 金鑰', 'error');
        return;
      }

      if (entered === activePasscode) {
        syncModal.classList.add('hidden');
        return;
      }

      activePasscode = entered;
      window.history.replaceState(null, '', getShareableUrl(activePasscode));
      syncModal.classList.add('hidden');
      showToast(`已切換至金鑰: ${activePasscode}，正在同步...`, 'success');
      
      bindFirestoreListener();
    });

    // Copy Sync Link shortcuts
    btnCopySyncLink.addEventListener('click', () => {
      copyToClipboard(getShareableUrl(activePasscode));
    });

    btnModalCopyUrl.addEventListener('click', () => {
      const entered = sanitizePasscode(modalPasscodeInput.value) || activePasscode;
      copyToClipboard(getShareableUrl(entered));
    });

    // Kickoff setup on load
    window.addEventListener('DOMContentLoaded', () => {
      // Restore theme preference from session
      const savedTheme = sessionStorage.getItem('todo_theme_mode');
      if (savedTheme === 'light') {
        applyTheme(true);
      } else {
        applyTheme(false);
      }

      updatePasscodeHeader();
      setupFirebase();
    });
  </script>
</body>
</html>
